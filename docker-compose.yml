version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: swisswall-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: swisswallpanels
      MYSQL_USER: swisswalluser
      MYSQL_PASSWORD: swisswallpassword
      TZ: Europe/Zurich
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: swisswall-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: swisswall-phpmyadmin
    restart: always
    ports:
      - '8080:80'
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=rootpassword
    depends_on:
      - mysql

volumes:
  mysql_data:
  redis_data:
